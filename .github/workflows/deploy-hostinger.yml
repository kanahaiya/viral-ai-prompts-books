name: Deploy to Hostinger (main)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-production-deploy
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Lint PHP files
        run: |
          php -l auth.php
          php -l index.php
          php -l config.php
          php -l config.production.php
          php -l login.php
          php -l setup-account.php
          php -l dashboard.php
          php -l book.php
          php -l admin/index.php
          php -l api/razorpay-order.php
          php -l api/razorpay-verify.php
          php -l api/cashfree-order.php
          php -l api/cashfree-verify.php
          php -l api/paypal-order.php
          php -l api/paypal-capture.php

      - name: Install lftp for SFTP deploy
        run: sudo apt-get update && sudo apt-get install -y lftp openssh-client

      - name: Validate SFTP connectivity
        env:
          HOSTINGER_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_FTP_PORT }}
          HOSTINGER_REMOTE_DIR: ${{ secrets.HOSTINGER_SFTP_REMOTE_DIR }}
        run: |
          REMOTE_DIR="${HOSTINGER_REMOTE_DIR:-domains/aipromptbooks.in/public_html}"
          echo "Checking SFTP TCP connectivity to ${HOSTINGER_SERVER}:${HOSTINGER_PORT}"
          if ! nc -zvw10 "$HOSTINGER_SERVER" "$HOSTINGER_PORT"; then
            echo "TCP probe timed out/blocked; continuing to lftp auth check."
          fi
          lftp -d -u "$HOSTINGER_USERNAME","$HOSTINGER_PASSWORD" "sftp://$HOSTINGER_SERVER:$HOSTINGER_PORT" -e "
            set cmd:fail-exit true;
            set sftp:auto-confirm yes;
            set net:max-retries 1;
            set net:timeout 20;
            pwd;
            ls;
            cls -1 ${REMOTE_DIR};
            quit
          "

      - name: Deploy to Hostinger via SFTP
        env:
          HOSTINGER_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_FTP_PORT }}
          HOSTINGER_REMOTE_DIR: ${{ secrets.HOSTINGER_SFTP_REMOTE_DIR }}
        run: |
          REMOTE_DIR="${HOSTINGER_REMOTE_DIR:-domains/aipromptbooks.in/public_html}"
          echo "Deploying to remote dir: ${REMOTE_DIR}"
          lftp -d -u "$HOSTINGER_USERNAME","$HOSTINGER_PASSWORD" "sftp://$HOSTINGER_SERVER:$HOSTINGER_PORT" -e "
            set cmd:fail-exit true;
            set sftp:auto-confirm yes;
            set net:max-retries 1;
            set net:timeout 20;
            cd ${REMOTE_DIR};
            mirror --reverse --verbose --no-perms --ignore-time \
              -x '(^|/)\.git(/|$)' \
              -x '(^|/)\.github(/|$)' \
              -x '(^|/)\.cursor(/|$)' \
              -x '(^|/)node_modules(/|$)' \
              -x '(^|/)\.env[^/]*$' \
              -x '(^|/)\.gitignore$' \
              -x '(^|/)\.htaccess$' \
              -x '(^|/)config\.production\.php$' \
              -x '(^|/)local\.db$' \
              -x '(^|/)db\.sql$' \
              -x '(^|/)setup-local\.php$' \
              -x '(^|/)\.ftp-deploy-sync-state[^/]*$' \
              -x '(^|/)[^/]*\.md$' \
              -x '(^|/)[^/]*\.plan\.md$' \
              -x '(^|/)\.DS_Store$' \
              . .;
            quit
          "

