name: Deploy to Hostinger (main)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-production-deploy
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Lint PHP files
        run: |
          php -l auth.php
          php -l index.php
          php -l config.php
          php -l config.production.php
          php -l login.php
          php -l setup-account.php
          php -l dashboard.php
          php -l book.php
          php -l admin/index.php
          php -l api/razorpay-order.php
          php -l api/razorpay-verify.php
          php -l api/cashfree-order.php
          php -l api/cashfree-verify.php
          php -l api/paypal-order.php
          php -l api/paypal-capture.php

      - name: Install lftp for SFTP deploy
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to Hostinger via SFTP
        env:
          HOSTINGER_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_FTP_PORT }}
        run: |
          lftp -u "$HOSTINGER_USERNAME","$HOSTINGER_PASSWORD" "sftp://$HOSTINGER_SERVER:$HOSTINGER_PORT" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            set net:timeout 20;
            mirror --reverse --only-newer --verbose \
              --exclude-glob .git\* \
              --exclude-glob .github/\* \
              --exclude-glob .cursor/\* \
              --exclude-glob node_modules/\* \
              --exclude-glob .env\* \
              --exclude-glob config.production.php \
              --exclude-glob local.db \
              --exclude-glob db.sql \
              --exclude-glob setup-local.php \
              --exclude-glob .ftp-deploy-sync-state.json \
              --exclude-glob .ftp-deploy-sync-state\* \
              --exclude-glob \*.md \
              --exclude-glob \*.plan.md \
              --exclude-glob .DS_Store \
              . /;
            quit
          "

