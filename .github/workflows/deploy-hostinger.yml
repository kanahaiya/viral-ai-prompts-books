name: Deploy to Hostinger (main)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-production-deploy
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Lint PHP files
        run: |
          php -l auth.php
          php -l index.php
          php -l config.php
          php -l config.production.php
          php -l login.php
          php -l setup-account.php
          php -l dashboard.php
          php -l book.php
          php -l admin/index.php
          php -l api/razorpay-order.php
          php -l api/razorpay-verify.php
          php -l api/cashfree-order.php
          php -l api/cashfree-verify.php
          php -l api/paypal-order.php
          php -l api/paypal-capture.php

      - name: Deploy to Hostinger via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          # Switch to SFTP for encrypted transport and better deploy stability.
          protocol: sftp
          port: ${{ secrets.HOSTINGER_FTP_PORT }}
          # This FTP user is chrooted to Hostinger web root already.
          # Using /public_html/ here creates public_html/public_html.
          server-dir: /
          # Hostinger can be slow to respond on control socket from GitHub runners.
          # Increase timeout to reduce intermittent "Timeout (control socket)" failures.
          timeout: 120000
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git/**
            **/.github/**
            **/.cursor/**
            **/node_modules/**
            **/.env*
            **/config.production.php
            **/local.db
            **/db.sql
            **/setup-local.php
            **/.ftp-deploy-sync-state.json
            **/.ftp-deploy-sync-state*
            **/*.md
            **/*.plan.md
            **/.DS_Store

